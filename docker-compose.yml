services:
  php:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    image: ${ACCEPTANCE_PHP_IMAGE:-example-jsonapi-php}
    working_dir: /srv/app
    command: php -S 0.0.0.0:8000 -t public
    volumes:
      - ./:/srv/app
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1
      DATABASE_URL: "postgresql://symfony:symfony@pgsql:5432/symfony_pg?serverVersion=16&charset=utf8"
      MYSQL_URL: "mysql://symfony:symfony@mysql:3306/symfony_mysql?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      pgsql: {condition: service_healthy}
      mysql: {condition: service_healthy}
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: symfony_pg
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: symfony
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U symfony -d symfony_pg']
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: symfony_mysql
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/acceptance.sql:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -proot]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
  mysqldata:
networks:
  default:
    ipam:
      config:
        - subnet: ${ACCEPTANCE_SUBNET:-172.30.249.0/24}
