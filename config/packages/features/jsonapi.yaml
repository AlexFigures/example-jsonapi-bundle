jsonapi:
    limits:
        filter_max_depth: 3
        filter_max_nodes: 5
        filter_max_operands: 4
        complexity_budget: 20
    relationships:
        linkage_in_resource: never
        write_response: '204'
    performance:
        doctrine:
            collection_sort_policy: reject
    docs:
        generator:
            openapi:
                title: Feature cookbook
                version: 0.9.0
                servers: ['https://cookbook.example.test']
        ui:
            theme: redoc
